<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 模拟面试 · 原型</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1c19; --muted: #6b6860; --line: #e4e1d8;
    --accent: #2f5bd3; --accent-soft: #e8eefc; --good: #2e7d4f; --warn: #b7791f; --bad: #c0392b;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .badge.mock { background: #fbf1dc; color: var(--warn); }
  header .spacer { flex: 1; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px; }
  .hidden { display: none !important; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  h2 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; }
  .hint { font-weight: 400; color: var(--muted); }
  input, select, textarea { width: 100%; font: inherit; color: inherit; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
  button { font: inherit; border-radius: 8px; padding: 9px 16px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  button:hover:not(:disabled) { border-color: #c9c5b9; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.07); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 10px; align-items: center; }
  .error { color: var(--bad); margin-top: 10px; white-space: pre-wrap; }

  /* 面试 */
  #interview { display: grid; grid-template-columns: 1fr 320px; gap: 20px; height: calc(100vh - 120px); }
  .chat { display: flex; flex-direction: column; min-height: 0; padding: 0; }
  .msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg.interviewer { background: #f1f0eb; align-self: flex-start; border-top-left-radius: 4px; }
  .msg.candidate { background: var(--accent); color: #fff; align-self: flex-end; border-top-right-radius: 4px; }
  .msg .who { display: block; font-size: 12px; opacity: .7; margin-bottom: 2px; }
  .divider { align-self: center; font-size: 12px; color: var(--muted); }
  .typing::after { content: "▍"; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .composer { border-top: 1px solid var(--line); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .composer textarea { min-height: 84px; }
  .composer .row { justify-content: space-between; }
  .side { display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
  .side h3 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .progress { display: flex; gap: 4px; margin-top: 8px; }
  .progress span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
  .progress span.done { background: var(--accent); }
  .progress span.now { background: #9db3ee; }
  .stage { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .depth { display: inline-flex; gap: 4px; vertical-align: middle; }
  .depth i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: inline-block; }
  .depth i.on { background: var(--warn); }
  .scores { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > b { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .muted { color: var(--muted); font-size: 13px; }
  .switch { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 400; margin: 0; cursor: pointer; }
  .switch input { width: auto; }

  /* 报告 */
  .report-head { display: grid; grid-template-columns: 200px 1fr; gap: 28px; align-items: center; }
  .total { text-align: center; }
  .total .num { font-size: 64px; font-weight: 700; line-height: 1; }
  .total .of { color: var(--muted); }
  .dims .scores { font-size: 14px; gap: 10px 14px; }
  .dims .bar { height: 10px; border-radius: 5px; }
  .section { margin-top: 20px; }
  .section h3 { font-size: 16px; margin: 0 0 10px; }
  .weak { border-left: 3px solid var(--warn); padding: 8px 14px; margin-bottom: 10px; background: #fdf8ee; border-radius: 0 8px 8px 0; }
  .weak b { display: block; }
  details.q { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; background: #fff; }
  details.q summary { cursor: pointer; display: flex; gap: 10px; align-items: center; }
  details.q summary .qt { flex: 1; }
  .pill { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
  .pill.g { background: #e5f4e9; color: var(--good); } .pill.m { background: #fbf1dc; color: var(--warn); } .pill.b { background: #fbe9e7; color: var(--bad); }
  .qa { margin: 10px 0; font-size: 14px; }
  .qa p { margin: 4px 0; }
  ul { margin: 6px 0; padding-left: 20px; }
  .history { margin-top: 20px; }
  .history table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .history td, .history th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .history th { color: var(--muted); font-weight: 600; font-size: 12px; }
  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr 1fr; } .two { grid-template-columns: 1fr; }
    #interview { grid-template-columns: 1fr; height: auto; } .msgs { max-height: 60vh; }
    .report-head { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>AI 模拟面试</h1>
  <span id="modeBadge" class="badge">连接中…</span>
  <span class="spacer"></span>
  <button id="homeBtn" class="hidden">返回首页</button>
</header>

<main>
  <!-- 配置 -->
  <section id="setup" class="card">
    <h2>开始一场模拟面试</h2>
    <p class="sub">贴上简历和目标 JD，AI 会按你的项目出题、层层追问，结束后给出复盘报告。</p>
    <div class="grid">
      <div><label for="role">岗位</label>
        <select id="role"><option>后端开发（Java）</option><option>后端开发（Go）</option><option>前端开发</option><option>客户端开发</option><option>算法工程师</option><option>测试开发</option></select></div>
      <div><label for="level">级别</label>
        <select id="level"><option>校招</option><option>社招 1-3 年</option><option>社招 3-5 年</option></select></div>
      <div><label for="style">面试风格</label>
        <select id="style"><option value="gentle">温和</option><option value="pressure">压力面</option></select></div>
      <div><label for="count">题目数量</label>
        <select id="count"><option>3</option><option selected>5</option><option>8</option></select></div>
    </div>
    <div class="two">
      <div><label for="resume">简历 <span class="hint">粘贴文本，重点是项目经历</span></label>
        <textarea id="resume" rows="10" placeholder="例：&#10;项目：校园二手交易平台（Spring Boot + Redis + MySQL）&#10;- 负责商品搜索与下单模块，用 Redis 缓存热门商品，QPS 从 300 提升到 2000&#10;- 用 RabbitMQ 异步处理订单超时取消"></textarea></div>
      <div><label for="jd">目标 JD <span class="hint">可选</span></label>
        <textarea id="jd" rows="10" placeholder="粘贴岗位描述，AI 会参考其中的技术栈和要求出题"></textarea></div>
    </div>
    <div class="row">
      <button id="startBtn" class="primary">开始面试</button>
      <span id="startStatus" class="muted"></span>
    </div>
    <div id="setupErr" class="error"></div>

    <div id="history" class="history hidden">
      <h3 class="muted" style="margin:24px 0 6px">历史记录</h3>
      <table><thead><tr><th>时间</th><th>岗位</th><th>级别</th><th>总分</th><th></th></tr></thead><tbody></tbody></table>
    </div>
  </section>

  <!-- 面试 -->
  <section id="interview" class="hidden">
    <div class="card chat">
      <div id="msgs" class="msgs"></div>
      <div class="composer">
        <textarea id="answer" placeholder="输入你的回答…（Ctrl + Enter 发送）" disabled></textarea>
        <div class="row">
          <div class="row">
            <button id="skipBtn" disabled>跳过本题</button>
            <button id="endBtn">结束面试</button>
          </div>
          <button id="sendBtn" class="primary" disabled>发送</button>
        </div>
      </div>
    </div>
    <aside class="side">
      <div class="card">
        <h3>进度</h3>
        <div><b id="qNum">第 1 题</b> <span id="qStage" class="stage"></span></div>
        <div id="progress" class="progress"></div>
        <div class="muted" style="margin-top:10px">追问深度 <span id="depth" class="depth"></span></div>
      </div>
      <div class="card">
        <label class="switch"><input type="checkbox" id="liveToggle"> 显示实时点评</label>
        <p class="muted" id="liveHint" style="margin:8px 0 0">关闭时更接近真实面试；结束后在报告里查看。</p>
        <div id="live" class="hidden" style="margin-top:12px"></div>
      </div>
    </aside>
  </section>

  <!-- 报告 -->
  <section id="report" class="hidden"></section>
</main>

<script>
const DIMS = [['accuracy', '准确性'], ['depth', '深度'], ['practical', '实战关联'], ['expression', '表达']];
const MAX_DEPTH = 3;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = {};

// ---------- API ----------
async function api(path, body) {
  const res = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
async function streamAsk(body, onChunk) {
  const res = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
  const reader = res.body.getReader(), dec = new TextDecoder();
  let text = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    text += dec.decode(value, { stream: true });
    onChunk(text);
  }
  return text.trim();
}

// ---------- 视图 ----------
function show(view) {
  for (const v of ['setup', 'interview', 'report']) $(v).classList.toggle('hidden', v !== view);
  $('homeBtn').classList.toggle('hidden', view === 'setup');
  if (view === 'setup') renderHistory();
}

function addMsg(role, text, typing) {
  const el = document.createElement('div');
  el.className = `msg ${role}` + (typing ? ' typing' : '');
  el.innerHTML = `<span class="who">${role === 'interviewer' ? '面试官' : '我'}</span><span class="t">${esc(text)}</span>`;
  $('msgs').appendChild(el);
  $('msgs').scrollTop = $('msgs').scrollHeight;
  return el;
}
function addDivider(text) {
  const el = document.createElement('div');
  el.className = 'divider'; el.textContent = text;
  $('msgs').appendChild(el);
}
function setBusy(b) {
  S.busy = b;
  $('answer').disabled = b; $('sendBtn').disabled = b; $('skipBtn').disabled = b;
  if (!b) $('answer').focus();
}
function renderSide() {
  const qs = S.plan.questions, q = qs[S.qi];
  if (!q) return;
  $('qNum').textContent = `第 ${S.qi + 1} / ${qs.length} 题`;
  $('qStage').textContent = `${q.stage} · ${q.topic}`;
  $('progress').innerHTML = qs.map((_, i) => `<span class="${i < S.qi ? 'done' : i === S.qi ? 'now' : ''}"></span>`).join('');
  $('depth').innerHTML = Array.from({ length: MAX_DEPTH }, (_, i) => `<i class="${i < S.depth ? 'on' : ''}"></i>`).join('');
}
function scoreRows(scores) {
  return DIMS.map(([k, name]) => `<span>${name}</span><div class="bar"><b style="width:${(scores[k] / 5) * 100}%"></b></div><span>${scores[k]}</span>`).join('');
}
function renderLive(j) {
  const on = $('liveToggle').checked;
  $('live').classList.toggle('hidden', !on || !j);
  $('liveHint').classList.toggle('hidden', on && !!j);
  if (!j) return;
  $('live').innerHTML = `<div class="muted" style="margin-bottom:8px">第 ${S.lastIdx + 1} 题 · 最近一次回答</div><div class="scores">${scoreRows(j.scores)}</div>
    <p style="margin:12px 0 4px;font-size:14px">${esc(j.comment)}</p>
    ${j.missed.length ? `<div class="muted">遗漏：${j.missed.map(esc).join('；')}</div>` : ''}`;
}

// ---------- 面试流程 ----------
async function start() {
  $('setupErr').textContent = '';
  $('startBtn').disabled = true;
  $('startStatus').textContent = '正在根据简历生成面试大纲…';
  Object.assign(S, {
    role: $('role').value, level: $('level').value, style: $('style').value,
    resume: $('resume').value.trim(), jd: $('jd').value.trim(), count: Number($('count').value),
    qi: 0, depth: 0, chains: [], results: [], lastJudge: null, finished: false,
  });
  try {
    S.plan = await api('/api/plan', { role: S.role, level: S.level, resume: S.resume, jd: S.jd, count: S.count });
    S.chains = S.plan.questions.map(() => []);
    $('msgs').innerHTML = '';
    renderLive(null);
    show('interview');
    renderSide();
    addDivider(`${S.plan.questions[0].stage} · ${S.plan.questions[0].topic}`);
    await ask('open');
  } catch (e) {
    $('setupErr').textContent = '启动失败：' + e.message;
  } finally {
    $('startBtn').disabled = false;
    $('startStatus').textContent = '';
  }
}

async function ask(mode, direction) {
  setBusy(true);
  const q = S.plan.questions[S.qi];
  const el = addMsg('interviewer', '', true);
  try {
    const text = await streamAsk(
      { mode, direction, q, chain: S.chains[S.qi], style: S.style, role: S.role, isLast: S.qi === S.plan.questions.length - 1 },
      (t) => { el.querySelector('.t').textContent = t; $('msgs').scrollTop = $('msgs').scrollHeight; }
    );
    el.classList.remove('typing');
    S.chains[S.qi].push({ role: 'interviewer', text });
  } catch (e) {
    el.classList.remove('typing');
    el.querySelector('.t').textContent = '（出错了：' + e.message + '）';
  }
  setBusy(false);
}

async function send() {
  const text = $('answer').value.trim();
  if (!text || S.busy) return;
  $('answer').value = '';
  addMsg('candidate', text);
  S.chains[S.qi].push({ role: 'candidate', text });
  setBusy(true);
  try {
    const j = await api('/api/judge', { q: S.plan.questions[S.qi], chain: S.chains[S.qi], depth: S.depth });
    S.results[S.qi] = j;
    S.lastJudge = j; S.lastIdx = S.qi;
    renderLive(j);
    if (j.verdict === 'follow_up') {
      S.depth++;
      renderSide();
      await ask('follow', j.direction);
    } else {
      await nextQuestion();
    }
  } catch (e) {
    addDivider('评分出错：' + e.message + '，请重新发送');
    S.chains[S.qi].pop();
    $('answer').value = text;
    setBusy(false);
  }
}

async function nextQuestion() {
  S.qi++; S.depth = 0;
  if (S.qi >= S.plan.questions.length) return finish();
  renderSide();
  const q = S.plan.questions[S.qi];
  addDivider(`${q.stage} · ${q.topic}`);
  await ask('next');
}

async function skip() {
  if (S.busy) return;
  S.results[S.qi] = { skipped: true };
  await nextQuestion();
}

async function finish() {
  if (S.finished) return;
  S.finished = true;
  setBusy(true);
  addDivider('面试结束，正在生成复盘报告…');
  const items = S.plan.questions.map((q, i) => {
    const r = S.results[i];
    return { ...q, chain: S.chains[i], skipped: !r || r.skipped, scores: r?.scores, comment: r?.comment, missed: r?.missed };
  });
  try {
    const rep = await api('/api/report', { role: S.role, level: S.level, items });
    const record = { at: Date.now(), role: S.role, level: S.level, items, report: rep, total: totalScore(items) };
    saveHistory(record);
    renderReport(record);
  } catch (e) {
    addDivider('生成报告失败：' + e.message);
    S.finished = false;
    setBusy(false);
  }
}

// ---------- 报告 ----------
const qSum = (s) => DIMS.reduce((a, [k]) => a + s[k], 0);
function totalScore(items) {
  if (!items.length) return 0;
  return Math.round(items.reduce((a, it) => a + (it.skipped ? 0 : qSum(it.scores) / 20), 0) / items.length * 100);
}
function dimAvg(items) {
  const done = items.filter((i) => !i.skipped);
  const out = {};
  for (const [k] of DIMS) out[k] = done.length ? Math.round(done.reduce((a, i) => a + i.scores[k], 0) / done.length * 10) / 10 : 0;
  return out;
}
function pill(it) {
  if (it.skipped) return '<span class="pill b">跳过</span>';
  const p = Math.round(qSum(it.scores) / 20 * 100);
  return `<span class="pill ${p >= 75 ? 'g' : p >= 50 ? 'm' : 'b'}">${p}</span>`;
}
function renderReport(rec) {
  const { items, report: rep } = rec;
  const avg = dimAvg(items);
  $('report').innerHTML = `
    <div class="card">
      <div class="report-head">
        <div class="total"><div class="num">${rec.total}</div><div class="of">总分 / 100</div></div>
        <div class="dims">
          <div class="muted" style="margin-bottom:10px">${esc(rec.role)} · ${esc(rec.level)} · ${new Date(rec.at).toLocaleString()}</div>
          <div class="scores">${DIMS.map(([k, n]) => `<span>${n}</span><div class="bar"><b style="width:${avg[k] / 5 * 100}%"></b></div><span>${avg[k]} / 5</span>`).join('')}</div>
        </div>
      </div>
      <div class="section"><h3>总体评价</h3><p style="margin:0">${esc(rep.summary)}</p>
        ${rep.highlights.length ? `<ul>${rep.highlights.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}</div>
      ${rep.weaknesses.length ? `<div class="section"><h3>优先补的弱项</h3>${rep.weaknesses.map((w) => `<div class="weak"><b>${esc(w.topic)}</b><div>${esc(w.why)}</div><div class="muted" style="margin-top:4px">怎么补：${esc(w.action)}</div></div>`).join('')}</div>` : ''}
      <div class="section"><h3>逐题复盘</h3>
        ${items.map((it, i) => `<details class="q"><summary><span class="qt">${i + 1}. ${esc(it.question)}</span><span class="stage">${esc(it.topic)}</span>${pill(it)}</summary>
          <div class="qa">${(it.chain || []).map((t) => `<p><b>${t.role === 'interviewer' ? '面试官' : '我'}：</b>${esc(t.text)}</p>`).join('')}</div>
          ${it.skipped ? '' : `<div class="scores" style="max-width:360px">${scoreRows(it.scores)}</div><p>${esc(it.comment)}</p>
            ${it.missed?.length ? `<div class="muted">遗漏：${it.missed.map(esc).join('；')}</div>` : ''}`}
          ${it.points?.length ? `<div style="margin-top:8px"><b style="font-size:13px">参考要点</b><ul>${it.points.map((p) => `<li>${esc(p)}</li>`).join('')}</ul></div>` : ''}
        </details>`).join('')}
      </div>
      <div class="row" style="margin-top:20px"><button class="primary" onclick="show('setup')">再来一场</button></div>
    </div>`;
  show('report');
}

// ---------- 历史 ----------
const HKEY = 'mock-interview-history';
const loadHistory = () => { try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch { return []; } };
function saveHistory(rec) { localStorage.setItem(HKEY, JSON.stringify([rec, ...loadHistory()].slice(0, 30))); }
function renderHistory() {
  const h = loadHistory();
  $('history').classList.toggle('hidden', !h.length);
  $('history').querySelector('tbody').innerHTML = h.map((r, i) =>
    `<tr><td>${new Date(r.at).toLocaleString()}</td><td>${esc(r.role)}</td><td>${esc(r.level)}</td><td><b>${r.total}</b></td><td><button data-i="${i}">查看报告</button></td></tr>`).join('');
}
$('history').addEventListener('click', (e) => { const i = e.target.dataset.i; if (i !== undefined) renderReport(loadHistory()[i]); });

// ---------- 事件 ----------
$('startBtn').onclick = start;
$('sendBtn').onclick = send;
$('skipBtn').onclick = skip;
$('endBtn').onclick = () => { if (!S.busy && confirm('确定结束面试并生成报告？未回答的题会记为跳过。')) finish(); };
$('homeBtn').onclick = () => { if (S.busy) return; if (!$('interview').classList.contains('hidden') && !S.finished && !confirm('面试还没结束，确定离开？')) return; show('setup'); };
$('answer').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
$('liveToggle').onchange = () => renderLive(S.lastJudge || null);

api('/api/config').then((c) => {
  $('modeBadge').textContent = c.mock ? 'Mock 模式 · 未配置模型' : '模型：' + c.model;
  $('modeBadge').classList.toggle('mock', c.mock);
}).catch(() => { $('modeBadge').textContent = '服务未连接'; });
show('setup');
</script>
</body>
</html>
